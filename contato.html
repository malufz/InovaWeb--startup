<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato|InovaWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100"> 

    <header class="container-fluid bg-dark text-white p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h1 class="h3 m-0">InovaWeb </h1>
        </div>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Menu principal">
            <div class="container-fluid p-0">
              <a class="navbar-brand" href="index.html">Menu</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                  <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                  <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                  <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                  <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                  <li class="nav-item"><a class="nav-link active" aria-current="page" href="contato.html">Contato</a></li> 
                </ul>
              </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1" style="max-width: 700px;">
        <section class="mb-4 text-center">
            <h2 class="display-5 fw-bold mb-2">Fale Conosco</h2>
            <p class="text-muted">Tem alguma dúvida ou sugestão? Preencha o formulário abaixo e entraremos em contato.</p>
        </section>

        <section class="bg-light p-4 rounded shadow-sm">
            <form>
                <div class="mb-3">
                    <label for="nome" class="form-label fw-bold">Nome completo:</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">E-mail:</label>
                    <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="mensagem" class="form-label fw-bold">Mensagem:</label>
                    <textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto"> 
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="footer-copy text-center text-md-start">
                <p class="m-0">© 2026 InovaWeb. Todos os direitos reservados.</p>
            </div>
            <section class="footer-contato text-center text-md-start m-0">  
                <h2 class="h6 fw-bold">Contato </h2>
                <address class="m-0 small">Email: contato@inovaweb.com.br<br>Tel/WhatsApp: (21) 4002-8922</address>
            </section>
            <nav class="footer-redes d-flex gap-3 fs-5" aria-label="Redes Sociais">
                <a href="https://pt-br.facebook.com/" target="_blank" rel="noopener" class="text-white" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener" class="text-white" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                <a href="https://x.com/" target="_blank" rel="noopener" class="text-white" aria-label="X"><i class="bi bi-twitter-x"></i></a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
